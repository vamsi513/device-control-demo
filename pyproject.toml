[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "device-control-demo"
version = "0.1.0"
description = "Send commands to simulated devices over MQTT with acknowledgements and retries"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  # Keep this pin in step with RUFF_VERSION in .github/workflows/ci.yml.
  "ruff==0.16.10",
]

[project.scripts]
device-sim = "device_control.cli:device_main"
device-send = "device_control.cli:send_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: exercises a real MQTT broker; skipped when none is reachable",
]
